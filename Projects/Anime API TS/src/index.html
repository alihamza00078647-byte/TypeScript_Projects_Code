<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Shelf — Card</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="../src/output.css" rel="stylesheet">
</head>

<body class="min-h-screen bg-paperDark font-body text-ink [background-image:radial-gradient(theme(colors.ink/6%)_1px,transparent_1px)] [background-size:14px_14px]">

  <main class="max-w-6xl mx-auto px-6 py-16">

    <!-- section head -->
    <div class="flex items-end justify-between mb-10 border-b-4 border-ink pb-3">
      <div>
        <p class="font-mono text-[11px] tracking-[0.3em] text-seal uppercase mb-1">巻 · Watch Shelf</p>
        <h1 class="font-display text-4xl tracking-wide">Currently Airing</h1>
      </div>
      <p class="font-mono text-xs text-ink/50 hidden sm:block">4 series · stamped by rating</p>
    </div>

    <!-- card grid -->
    <div class="card-element grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-x-8 gap-y-14">

      <!-- CARD -->
      <article class="group relative bg-paper border-[3px] border-ink [clip-path:polygon(0_0,100%_0,100%_92%,93%_100%,0_100%)] transition-transform duration-300 hover:-translate-y-1.5 hover:-rotate-1 shadow-[6px_6px_0_0_theme(colors.ink)]">

        <!-- poster -->
        <div class="relative aspect-[3/4] border-b-[3px] border-ink overflow-hidden bg-[linear-gradient(160deg,theme(colors.indigo),theme(colors.ink))]">
           <div class="absolute inset-0 opacity-25 [background-image:radial-gradient(theme(colors.paper)_1.5px,transparent_1.5px)] [background-size:9px_9px] mix-blend-overlay"></div>
           <img src="https://cdn.myanimelist.net/images/anime/1122/96435.webp" class="absolute inset-0 m-auto w-fit h-fit text-7xl text-paper/20 group-hover:scale-110 transition-transform duration-500" alt="fa-solid fa-ghost" />
            <!-- <img src="" alt=""> -->


          <!-- status flag -->
          <span class="absolute top-0 left-3 bg-seal text-paper font-mono text-[10px] tracking-widest uppercase px-2 py-1 [clip-path:polygon(0_0,100%_0,100%_75%,50%_100%,0_75%)]">Airing</span>

          <!-- hanko seal -->
          <div class="absolute -top-3 -right-3 w-16 h-16 rounded-full bg-seal ring-[3px] ring-seal ring-offset-2 ring-offset-paper flex flex-col items-center justify-center rotate-[-12deg] group-hover:rotate-0 transition-transform duration-300">
            <span class="font-mono font-bold text-paper text-lg leading-none">9.2</span>
            <span class="font-mono text-paper/80 text-[7px] tracking-[0.2em] mt-0.5">SCORE</span>
          </div>
        </div>

        <!-- ticket notches -->
        <div class="relative">
          <span class="absolute -left-[9px] top-[164px] w-4 h-4 rounded-full bg-paperDark border-[3px] border-ink"></span>
          <span class="absolute -right-[9px] top-[164px] w-4 h-4 rounded-full bg-paperDark border-[3px] border-ink"></span>
        </div>

        <!-- body -->
        <div class="p-4">
          <p class="font-mono text-[10px] tracking-widest text-seal uppercase mb-1">Shōnen · Fantasy</p>
          <h3 class="font-display text-xl leading-snug mb-1">Ashfall Requiem</h3>
          <p class="text-ink/50 text-xs mb-3">Studio Kurogane</p>

          <div class="border-t-2 border-dashed border-ink/30 my-3"></div>

          <div class="flex items-center justify-between font-mono text-xs">
            <span class="bg-ink text-paper px-2 py-1">EP 18/24</span>
            <span class="flex items-center gap-0.5 text-gold">
              <i class="fa-solid fa-star text-[10px]"></i>
              <i class="fa-solid fa-star text-[10px]"></i>
              <i class="fa-solid fa-star text-[10px]"></i>
              <i class="fa-solid fa-star text-[10px]"></i>
              <i class="fa-regular fa-star text-[10px]"></i>
            </span>
          </div>

          <div class="flex flex-wrap gap-1.5 mt-3">
            <span class="text-[10px] uppercase tracking-wide border border-ink/40 rounded-full px-2 py-0.5 text-ink/70">Dark</span>
            <span class="text-[10px] uppercase tracking-wide border border-ink/40 rounded-full px-2 py-0.5 text-ink/70">Mecha</span>
          </div>
        </div>
      </article>


    </div>
  </main>

  <script src="../dist/index.js"></script>
</body>
</html>
